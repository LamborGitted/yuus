[package]
name = "yuus-desktop"
version = "0.1.0"
description = "Desktop image replacement workstation for Yuus"
authors = ["OpenAI"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
